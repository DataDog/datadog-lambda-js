name: local integration tests

# Runs the docker-only integration test harness in integration_tests_local/
# against the real AWS Lambda base images + the Runtime Interface Emulator
# (RIE). No AWS account or credentials required.
#
# One job per Node major version; each job builds and tests both container
# variants (cjs, esm), which share the same ~1 GB base image, so each job
# pulls it exactly once. If public.ecr.aws anonymous pull limits ever bite,
# the fix is to mirror the base images to GHCR (same pattern dd-trace-js
# uses in its mirror-image.yml workflow).

on:
  pull_request:
  push:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  container:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node_major: ["18", "20", "22", "24", "26"]

    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - name: Set up Node 18.12
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: 18.12

      - name: Run local container integration tests (nodejs${{ matrix.node_major }}.x)
        # Generate an ephemeral Node 26 baseline until PR 2 adds its snapshots.
        env:
          UPDATE_SNAPSHOTS: ${{ matrix.node_major == '26' && 'true' || '' }}
        run: PLATFORM=linux/amd64 RUNTIME_PARAM=${{ matrix.node_major }} ./integration_tests_local/run.sh

      # Expect 9 events x 2 variants, plus one log per variant.
      - name: Assert Node 26 generated a complete baseline
        if: matrix.node_major == '26'
        run: |
          returns=$(find integration_tests_local/snapshots/return_values -type f -name '*_node26_*.json' | wc -l)
          logs=$(find integration_tests_local/snapshots/logs -type f -name '*_node26.log' | wc -l)
          echo "Generated $returns return-value and $logs log artifacts for node26"
          if [ "$returns" -ne 18 ] || [ "$logs" -ne 2 ]; then
            echo "FAILURE: expected 18 return-value and 2 log artifacts, got $returns and $logs" >&2
            exit 1
          fi

      # Only the Node 26 leg may create uncommitted snapshots.
      - name: Assert no committed snapshot was mutated
        if: always()
        run: |
          if ! git diff --exit-code --stat integration_tests_local/snapshots; then
            echo "FAILURE: this run modified committed snapshots" >&2
            exit 1
          fi
          new_files=$(git ls-files --others --exclude-standard integration_tests_local/snapshots)
          if [ "${{ matrix.node_major }}" = "26" ]; then
            new_file_count=$(printf '%s\n' "$new_files" | sed '/^$/d' | wc -l)
            if [ "$new_file_count" -ne 20 ]; then
              echo "FAILURE: expected exactly 20 ephemeral node26 snapshots, got $new_file_count" >&2
              echo "$new_files" >&2
              exit 1
            fi
            echo "Ephemeral node26 baseline (not committed):"
            echo "$new_files"
          elif [ -n "$new_files" ]; then
            echo "FAILURE: strict leg created snapshots instead of comparing:" >&2
            echo "$new_files" >&2
            exit 1
          fi
