# status-code-500s
status-code-500s_node:
  name: integration-tests-js-${sls:stage}-status-code-500s_${env:RUNTIME}
  handler: status-code-500s.handle
  runtime: ${env:SERVERLESS_RUNTIME}
  events:
    - http:
        path: test/hello
        method: get
  layers:
    - { Ref: NodeLambdaLayer }
  environment:
    DD_TRACE_ENABLED: true
